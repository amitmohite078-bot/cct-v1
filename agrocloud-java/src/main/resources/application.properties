server.port=8080
spring.application.name=AgroCloud AI Enterprise

# Disease Screening Settings
agrocloud.disease.model-version=v1.1.0-solanaceae-onnx-proto
agrocloud.disease.model-path=models/solanaceae_mobilenetv3.onnx
agrocloud.disease.abstention-threshold=0.70
agrocloud.disease.margin-threshold=0.15
agrocloud.disease.blur-laplacian-threshold=4.0
agrocloud.disease.min-brightness=25.0
agrocloud.disease.max-brightness=230.0
agrocloud.disease.python-sidecar-url=http://127.0.0.1:8000
agrocloud.disease.prefer-embedded-onnx=true

# Agrometeorology & Weather Settings
agrocloud.weather.cache-ttl-hours=1
agrocloud.weather.api-timeout-seconds=10
agrocloud.weather.open-meteo-url=https://api.open-meteo.com/v1/forecast

# Privacy & Audit Settings
agrocloud.audit.db-path=data/agrocloud_audit.db
agrocloud.audit.coordinate-precision=2

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
